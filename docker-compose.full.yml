name: app-full-stack

# SQLite-first: the app needs no external services. Data (SQLite DB + bunqueue
# storage) persists in the `app-data` volume.
services:
  app-backend-full:
    container_name: app-backend-full
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        API_PORT: ${API_PORT}
    env_file:
      - .env.full
    environment:
      NODE_ENV: production
      APP_ENV: local
      DB_TYPE: sqlite
      SQLITE_DB_PATH: /app/data/app.db
      QUEUE_DATA_PATH: /app/data/queue
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - app-data:/app/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:${API_PORT}/api/service/health || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-full

volumes:
  app-data:

networks:
  app-full:
    name: app-network-full
    driver: bridge
