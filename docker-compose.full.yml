name: app-full-stack

# Full stack: app (SQLite by default) + Redis (BullMQ queue, Socket.io adapter,
# throttler, cache). Postgres is optional (SQLite-first) — only started with
# `--profile postgres`; the app runs on SQLite regardless.
services:
  app-postgres-full:
    image: public.ecr.aws/docker/library/postgres:17.5
    # Optional — only started with `--profile postgres` (SQLite is the default DB).
    profiles: ['postgres']
    env_file:
      - .env.full
    ports:
      - ${POSTGRES_PORT:-5438}:${POSTGRES_PORT:-5438}
    volumes:
      - ${POSTGRES_DATA_DIR:-./.tmp/postgres_data}:/var/lib/postgresql/data
    networks:
      - app-full
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5438}
      PGPORT: ${POSTGRES_PORT:-5438}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 5s
      retries: 10

  app-redis-full:
    image: public.ecr.aws/docker/library/redis:8.4.0
    env_file:
      - .env.full
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: >
      sh -c "
      if [ -n \"$REDIS_PASSWORD\" ]; then
        redis-server --requirepass $REDIS_PASSWORD
      else
        redis-server
      fi
      "
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - 'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a $REDIS_PASSWORD ping; else redis-cli ping; fi'
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - app-full

  app-backend-full:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        API_PORT: ${API_PORT}
    env_file:
      - .env.full
    environment:
      # Override specific values for the Docker environment.
      # SQLite-first: the DB is a file in the app-data volume; point Redis at
      # the container. (For Postgres, add POSTGRES_HOST: app-postgres-full and
      # start with --profile postgres — not supported by the app yet.)
      DB_TYPE: sqlite
      SQLITE_DB_PATH: /app/data/app.db
      REDIS_HOST: app-redis-full
      REDIS_PORT: 6379
      NODE_ENV: production
      APP_ENV: local
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - app-data:/app/data
    depends_on:
      app-redis-full:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:${API_PORT}/api/service/health || exit 1',
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-full

volumes:
  postgres-data:
  redis-data:
  app-data:

networks:
  app-full:
    name: app-network-full
    driver: bridge
